services:
  site:
    container_name: site
    build:
      context: .
      dockerfile: conf/site/Dockerfile
    restart: on-failure
    ports:
      - 50180:80
    volumes:
      - ./src/site:/var/www/html
      - ./src/Data:/var/www/html/Data
    # user: "root:www-data"

  webservice:
    container_name: webservice
    build:
      context: .
      dockerfile: conf/webservice/Dockerfile
    restart: on-failure
    ports:
      - 50181:80
    volumes:
      - ./src/webservice:/var/www/html
      - ./src/Data:/var/www/html/Data
    # user: "root:www-data"

  # Serveur WebSocket optionnel (troisième partie). Il n'est pas démarré par
  # défaut : docker compose --profile websocket up -d
  websocket:
    container_name: websocket
    build:
      context: .
      dockerfile: conf/websocket/Dockerfile
    profiles: ["websocket"]
    restart: on-failure
    ports:
      - 50200:50200
    environment:
      FEED_PATH: /app/Data/Events/feed.json
      WS_PORT: 50200
    volumes:
      - ./src/Data:/app/Data
